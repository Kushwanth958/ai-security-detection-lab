[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-detection-lab"
version = "0.1.0"
description = "A reproducible LLM application security and SOC research lab"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
aisec-lab = "aisec_lab.cli:main"

[tool.setuptools.package-data]
aisec_lab = ["static/*", "data/*"]

[tool.setuptools.packages.find]
include = ["aisec_lab*"]
